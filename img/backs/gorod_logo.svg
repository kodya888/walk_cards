<svg xmlns="http://www.w3.org/2000/svg" viewBox="195 165 470 800">
  <!-- Логотип рубашки пака «Чудики»: ночной смотритель с фонарём.
       Вырезан из img/2-nochnoy_smotritel_fonarey.svg (сцена убрана).
       Используется как маска: важна только непрозрачность фигур. -->

  <!-- фонарь -->
  <g stroke="#1d2432" stroke-width="8" stroke-linecap="round">
    <rect x="565" y="470" width="40" height="400" fill="#37455c"/>
